version: '3.9'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: reliefnet
      POSTGRES_USER: reliefnet
      POSTGRES_PASSWORD: reliefnet
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://reliefnet:reliefnet@postgres:5432/reliefnet
    ports:
      - '8000:8000'
    depends_on:
      - postgres

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '5173:5173'
    depends_on:
      - backend

volumes:
  postgres_data:
